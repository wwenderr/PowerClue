      <text x="748" y="398" fill="#e7f2ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">CPU</text><text x="1049" y="398" fill="#f7fbff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="700">42%</text>
      <rect x="748" y="411" width="367" height="10" rx="5" fill="#29394e"/><rect x="748" y="411" width="154" height="10" rx="5" fill="#ff854e"/>
      <text x="748" y="455" fill="#e7f2ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Memory</text><text x="1049" y="455" fill="#f7fbff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="700">68%</text>
      <rect x="748" y="468" width="367" height="10" rx="5" fill="#29394e"/><rect x="748" y="468" width="250" height="10" rx="5" fill="#438cff"/>
      <text x="748" y="505" fill="#87a2c1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Thermal state: normal</text>

