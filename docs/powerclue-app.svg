    </g>
    <g fill="#26374c"><rect x="1351" y="275" width="157" height="12" rx="6"/><rect x="1351" y="311" width="157" height="12" rx="6"/><rect x="1351" y="347" width="157" height="12" rx="6"/></g>
    <rect x="1351" y="275" width="66" height="12" rx="6" fill="#ff854e"/><rect x="1351" y="311" width="107" height="12" rx="6" fill="#448aff"/><rect x="1351" y="347" width="47" height="12" rx="6" fill="#8056e6"/>
    <text x="1215" y="400" fill="#a9bcd3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">TOP PROCESSES BY ACTIVITY</text>
    <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" fill="#eef5ff"><text x="1215" y="431">Google Chrome</text><text x="1215" y="463">WindowServer</text><text x="1215" y="495">Slack</text></g>
    <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" text-anchor="end"><text x="1498" y="431" fill="#ff826c">High</text><text x="1498" y="463" fill="#ffbc6c">Medium</text><text x="1498" y="495" fill="#ffbc6c">Medium</text></g>
    <rect x="1205" y="527" width="310" height="76" rx="11" fill="#23354e" stroke="#3c5575"/>
    <text x="1225" y="573" fill="#f0f7ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="600">Open dashboard</text><text x="1489" y="573" fill="#b7c9df" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20">›</text>
  </g>
  <text x="1200" y="694" fill="#9bb2d0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="600">One click to the clue.</text>
  <text x="1200" y="727" fill="#8199b9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Illustrative values shown</text>
</svg>
