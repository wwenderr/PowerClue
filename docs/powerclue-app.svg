      <text x="326" y="610" fill="#a2b7d1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">PROCESS</text><text x="688" y="610" fill="#a2b7d1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">ACTIVITY</text><text x="976" y="610" fill="#a2b7d1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">CPU</text>
      <path d="M324 620H1115M324 659H1115M324 698H1115" stroke="#304157"/>
      <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" fill="#eaf1fb"><text x="326" y="645">Google Chrome</text><text x="326" y="684">WindowServer</text><text x="326" y="723">Slack</text></g>
      <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="600"><text x="688" y="645" fill="#ff8069">High</text><text x="688" y="684" fill="#ffb35f">Medium</text><text x="688" y="723" fill="#ffb35f">Medium</text></g>
      <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#d8e6fa"><text x="978" y="645">42.1%</text><text x="978" y="684">24.3%</text><text x="978" y="723">8.2%</text></g>
    </g>
  </g>

  <g filter="url(#shadow)">
