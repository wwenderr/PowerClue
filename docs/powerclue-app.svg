      <circle cx="91" cy="144" r="7" fill="#ff5f57"/><circle cx="113" cy="144" r="7" fill="#febc2e"/><circle cx="135" cy="144" r="7" fill="#28c840"/>
      <text x="604" y="151" text-anchor="middle" fill="#dce8f8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="600">PowerClue</text>
      <rect x="65" y="169" width="205" height="613" fill="#121c2c"/>
      <text x="92" y="211" fill="#f3f7ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700">ϟ  PowerClue</text>
      <rect x="78" y="246" width="178" height="38" rx="9" fill="#2a3d56"/>
      <text x="99" y="271" fill="#eaf4ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="600">◉   Overview</text>
      <g fill="#96a9c4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">
        <text x="99" y="316">▦   Processes</text><text x="99" y="358">▰   Battery</text><text x="99" y="400">▥   Performance</text><text x="99" y="442">☾   Sleep</text><text x="99" y="484">◷   History</text><text x="99" y="526">⚙   Settings</text>
