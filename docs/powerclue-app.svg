      <text x="324" y="351" fill="#a8bbd4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="600">BATTERY</text>
      <text x="322" y="414" fill="#f8fbff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="56" font-weight="700">74%</text>
      <text x="325" y="448" fill="#ff8068" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700">−11.0 W</text>
      <text x="325" y="476" fill="#a9bdd5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">About 5h 10m remaining</text>
      <path d="M324 503 C351 498 362 510 390 504 S433 507 460 502 S510 510 538 501 S583 508 610 500 S665 506 683 500" fill="none" stroke="#ff785c" stroke-width="2.5"/>

