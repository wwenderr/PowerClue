<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-label="Illustration of the PowerClue dashboard and menu bar popover with sample data">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1731"/><stop offset=".55" stop-color="#101328"/><stop offset="1" stop-color="#1c1229"/></linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1a2437"/><stop offset="1" stop-color="#0d1728"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172337"/><stop offset="1" stop-color="#111b2b"/></linearGradient>
    <linearGradient id="warning" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#563039"/><stop offset="1" stop-color="#302637"/></linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4aa7ff" stop-opacity=".28"/><stop offset="1" stop-color="#4aa7ff" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="25" stdDeviation="28" flood-color="#020713" flood-opacity=".6"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="70"/></filter>
    <clipPath id="window-clip"><rect x="65" y="120" width="1120" height="662" rx="24"/></clipPath>
  </defs>
  <rect width="1600" height="860" fill="url(#background)"/>
  <ellipse cx="302" cy="210" rx="300" ry="200" fill="#207cff" opacity=".18" filter="url(#blur)"/>
  <ellipse cx="1323" cy="643" rx="300" ry="190" fill="#e95561" opacity=".15" filter="url(#blur)"/>
  <text x="72" y="75" fill="#83a4cc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700" letter-spacing="3">POWERCLUE  /  MACOS</text>
  <text x="1168" y="75" fill="#92a9c8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19">THE SIGNAL BEHIND THE DRAIN</text>

  <g filter="url(#shadow)">
    <rect x="65" y="120" width="1120" height="662" rx="24" fill="url(#window)" stroke="#3a4b63" stroke-width="2"/>
    <g clip-path="url(#window-clip)">
