    <circle cx="1226" cy="217" r="9" fill="#ff7253"/>
    <text x="1245" y="212" fill="#fff0eb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">High battery drain</text>
    <text x="1245" y="232" fill="#d8c1c6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">Above your recent baseline</text>
    <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#dfebfa">
      <text x="1216" y="287">CPU</text><text x="1216" y="323">Memory</text><text x="1216" y="359">Network</text>
    </g>
    <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#e9f3ff" text-anchor="end">
